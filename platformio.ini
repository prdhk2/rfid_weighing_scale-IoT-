; ESP32-S3 truck weighbridge ("timbangan truk") - Depok
; https://docs.platformio.org/page/projectconf.html

; Plain `pio run` / the IDE build button builds only this env. The release
; env needs secrets and the native env a host compiler - build those with -e.
[platformio]
default_envs = 4d_systems_esp32s3_gen4_r8n16

[env:4d_systems_esp32s3_gen4_r8n16]
; Pinned: an OTA image must come from the same toolchain/core as the one it
; replaces, not from whatever a platform update happens to pull in.
platform = espressif32@7.0.1
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder

; 16 MB table with two 6.5 MB app slots: one runs, the other receives OTA.
; Pinned so a platform bump can never swap it for a single-app layout.
; Changing the partition table needs one USB flash; OTA cannot do it.
board_build.partitions = default_16MB.csv

; PSRAM OFF - required by the wiring, do not change back to qio_opi.
; This board's octal PSRAM (ESP32-S3R8) uses GPIO33..37, and the RS485
; transceiver's DE/RE is wired to GPIO35. With the board default (qio_opi)
; the PSRAM is brought up at boot and pinMode(35, OUTPUT) cuts one of its
; data lines: every later PSRAM access - and every malloc > 4 KB, e.g. TLS
; buffers, lands there - reads garbage, i.e. random crashes. qio_qspi keeps
; the same QIO flash setup but looks for quad PSRAM, which is not there, so
; the device runs on its internal 512 KB SRAM (plenty for this firmware) and
; GPIO35 is an ordinary pin. peripherals.cpp refuses to drive GPIO35 if PSRAM
; is ever found active anyway.
board_build.arduino.memory_type = qio_qspi

lib_deps =
	olikraus/U8g2@^2.36.5
	adafruit/RTClib@^2.1.4
	knolleary/PubSubClient@^2.8

; Credentials (MQTT login, device id, Wi-Fi) are never committed: put them
; in secrets.ini (gitignored; copy secrets.ini.example), which this script
; turns into -D defines. See scripts/provision-device.sh on the server.
extra_scripts = pre:scripts/load_secrets.py

; Global: PubSubClient's 256-byte default silently drops the status
; payload. Mirrored by Config::MQTT_PACKET_SIZE.
build_flags =
	-D MQTT_MAX_PACKET_SIZE=2048

; Project sources only - the third-party libraries are not ours to lint.
build_src_flags =
	-Wall
	-Wextra
	-Wno-unused-parameter

; Release / OTA image: same firmware, refuses to compile without the Wi-Fi
; and MQTT credentials (an OTA image without MQTT could never be updated over
; the air again). ALWAYS build OTA uploads with this env:
;
;   pio run -e release
;   -> .pio/build/release/firmware.bin
[env:release]
extends = env:4d_systems_esp32s3_gen4_r8n16
build_flags =
	${env:4d_systems_esp32s3_gen4_r8n16.build_flags}
	-D DP_RELEASE_BUILD

; PC-host unit tests for lib/WeighCore (RFID framing, weight parsing, button
; debounce, HTTP outcome, OTA rollback decision, JSON extraction, ...). Needs
; a host C++ compiler (gcc/clang) on PATH:   pio test -e native
[env:native]
platform = native
build_flags =
	-std=c++17
	-Wall
	-Wextra
test_framework = unity
build_src_filter =
	-<*>
